{{define "content"}}
<article>
  <div class="page-title-area">
    <h1>{{.Page.Title}}</h1>
    <hr class="title-rule" />
    <div class="page-tabs">
      <a href="/skills/{{.Page.Slug}}">Skill</a>
      <a href="/edit-skill/{{.Page.Slug}}" class="active">Edit</a>
      <a href="/skill-history/{{.Page.Slug}}">History</a>
    </div>
  </div>
  {{if .Query}}<p class="error">{{.Query}}</p>{{end}}
  <p class="hint">{{if .IsNew}}Creating a new skill.{{else}}Editing skill.{{end}} End with a <code>Tags: keyword1, keyword2</code> line for discoverability.</p>
  <div class="editor-layout">
    <form method="post" action="/edit-skill/{{.Page.Slug}}" class="editor-form">
      <textarea id="editor" name="content" rows="28">{{.RawContent}}</textarea>
      <input type="hidden" id="editor-original" value="{{.RawContent}}" />
      <p id="editor-secure-status" class="hint" hidden></p>
      <div class="page-actions">
        <button type="submit">Save</button>
        <a class="button secondary" href="/skills/{{.Page.Slug}}">Cancel</a>
        {{if not .IsNew}}<button type="button" class="button danger"
                hx-post="/delete-skill/{{.Page.Slug}}"
                hx-confirm="Are you sure you want to delete this skill? This cannot be undone.">Delete</button>{{end}}
      </div>
    </form>
  </div>
</article>

<script>
(() => {
  const textarea = document.getElementById("editor");
  const form = textarea.closest("form");
  const originalInput = document.getElementById("editor-original");
  const secureStatus = document.getElementById("editor-secure-status");

  // Build prefixes from "{" + "{" so the raw delimiter doesn't appear in
  // source — Go's html/template would otherwise read it as an action start.
  const OPEN = "{" + "{";
  const SECURE_AES_PREFIX = OPEN + "secure_aes:";
  const SECURE_PREFIX = OPEN + "secure:";
  const hasSecureCipher = (s) => s.indexOf(SECURE_AES_PREFIX) >= 0;
  const hasSecurePlain = (s) => s.indexOf(SECURE_PREFIX) >= 0;

  function showStatus(msg, isError) {
    secureStatus.textContent = msg;
    secureStatus.hidden = !msg;
    secureStatus.classList.toggle("error", !!isError);
  }

  async function decryptEditor() {
    if (!hasSecureCipher(originalInput.value)) return;
    try {
      await window.gypsumSecure.requireKey();
      textarea.value = await window.gypsumSecure.decryptForEdit(textarea.value);
      showStatus("");
    } catch (err) {
      showStatus("Editor is locked — secure blocks shown as ciphertext. Click 🔒 to unlock.", true);
    }
  }

  if (window.gypsumSecure) {
    window.gypsumSecure.ready.then(decryptEditor);
    window.gypsumSecure.onChange((unlocked) => {
      if (unlocked && hasSecureCipher(textarea.value)) decryptEditor();
    });
  }

  form.addEventListener("submit", async (e) => {
    const hasPlain = hasSecurePlain(textarea.value);
    if (!hasPlain && !hasSecureCipher(originalInput.value)) return;
    e.preventDefault();
    try {
      if (hasPlain) {
        await window.gypsumSecure.requireKey();
      }
      textarea.value = await window.gypsumSecure.encryptForSave(textarea.value, originalInput.value);
      form.submit();
    } catch (err) {
      showStatus("Save aborted: " + (err && err.message ? err.message : "unlock cancelled"), true);
    }
  });
})();
</script>
{{end}}
