{{define "content"}}
<article>
  <div class="page-title-area">
    <h1>{{.Page.Title}}</h1>
    <hr class="title-rule" />
    <div class="page-tabs">
      <a href="/wiki/{{.Page.Slug}}" class="active">Page</a>
      <a href="/edit/{{.Page.Slug}}">Edit</a>
      <a href="/share/{{.Page.Slug}}">Share</a>
      <a href="/history/{{.Page.Slug}}">History</a>
    </div>
  </div>
  <div class="wiki-content">{{.RenderedHTML}}</div>
</article>

<script>
(() => {
  // Helper: decrypt ciphertext via the server endpoint.
  async function decryptSecret(ciphertext) {
    const response = await fetch("/secure-inline/unlock", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ ciphertext }).toString(),
    });
    const payload = await response.json();
    if (!response.ok || !payload.ok) {
      throw new Error(payload.error || "Decryption failed");
    }
    return payload.content || "";
  }

  // Copy buttons (always visible) — decrypt and copy without revealing.
  document.querySelectorAll(".secure-copy-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const ciphertext = btn.dataset.ciphertext || "";
      if (!ciphertext) return;
      try {
        const text = await decryptSecret(ciphertext);
        await navigator.clipboard.writeText(text);
        btn.textContent = "✓";
        setTimeout(() => { btn.textContent = "📋"; }, 1500);
      } catch (error) {
        console.error("secure copy failed:", error);
      }
    });
  });

  // Click-to-reveal on the lock span itself.
  document.querySelectorAll(".secure-inline").forEach((el) => {
    el.addEventListener("click", async () => {
      if (el.classList.contains("unlocked")) return;

      const ciphertext = el.dataset.ciphertext || "";
      if (!ciphertext) return;

      try {
        const text = await decryptSecret(ciphertext);

        el.textContent = "";
        if (text.includes("\n")) {
          text.split("\n").forEach((part, i, arr) => {
            el.appendChild(document.createTextNode(part));
            if (i < arr.length - 1) el.appendChild(document.createElement("br"));
          });
        } else {
          el.textContent = text;
        }
        el.classList.add("unlocked");

        setTimeout(() => {
          el.textContent = "🔒****";
          el.classList.remove("unlocked");
        }, 60000);
      } catch (error) {
        console.error("secure unlock failed:", error);
      }
    });
  });
})();
</script>
{{end}}
