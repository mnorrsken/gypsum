{{define "content"}}
<article>
  <div class="page-title-area">
    <h1>{{.Page.Title}}</h1>
    <hr class="title-rule" />
    <div class="page-tabs">
      <a href="/wiki/{{.Page.Slug}}" class="active">Page</a>
      <a href="/edit/{{.Page.Slug}}">Edit</a>
      <a href="/share/{{.Page.Slug}}">Share</a>
      <a href="/history/{{.Page.Slug}}">History</a>
    </div>
  </div>
  <div class="wiki-content">{{.RenderedHTML}}</div>
</article>

<script>
(() => {
  // Helper: decrypt ciphertext via the server endpoint (used by copy button).
  async function decryptSecret(ciphertext) {
    const response = await fetch("/secure-inline/unlock", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ ciphertext }).toString(),
    });
    const payload = await response.json();
    if (!response.ok || !payload.ok) {
      throw new Error(payload.error || "Decryption failed");
    }
    return payload.content || "";
  }

  // Copy buttons — decrypt and copy without revealing.
  document.querySelectorAll(".secure-copy-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const ciphertext = btn.dataset.ciphertext || "";
      if (!ciphertext) return;
      try {
        const text = await decryptSecret(ciphertext);
        await navigator.clipboard.writeText(text);
        btn.textContent = "\u2713";
        setTimeout(() => { btn.textContent = "\ud83d\udccb"; }, 1500);
      } catch (error) {
        console.error("secure copy failed:", error);
      }
    });
  });

  // Interactive task-list checkboxes — clicking toggles the checkbox in the page source.
  document.querySelectorAll(".wiki-content input[type='checkbox']").forEach((cb, i) => {
    cb.removeAttribute("disabled");
    cb.addEventListener("change", async (e) => {
      cb.disabled = true;
      try {
        await fetch("/toggle-checkbox/{{.Page.Slug}}", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ index: String(i) }).toString(),
        });
      } finally {
        cb.disabled = false;
      }
    });
  });

  // Auto-relock revealed secrets after 60 seconds.
  document.body.addEventListener("htmx:afterSwap", (e) => {
    const el = e.detail.elt;
    if (el.classList && el.classList.contains("secure-inline")) {
      el.classList.add("unlocked");
      setTimeout(() => {
        el.innerHTML = "\ud83d\udd12****";
        el.classList.remove("unlocked");
      }, 60000);
    }
  });
})();
</script>
{{end}}
