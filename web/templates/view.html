{{define "content"}}
<article>
  <div class="page-title-area">
    <h1>{{.Page.Title}}</h1>
    <hr class="title-rule" />
    <div class="page-tabs">
      <a href="/wiki/{{.Page.Slug}}" class="active">Page</a>
      <a href="/edit/{{.Page.Slug}}">Edit</a>
      <a href="/share/{{.Page.Slug}}">Share</a>
      <a href="/history/{{.Page.Slug}}">History</a>
    </div>
  </div>
  <div class="wiki-content">{{.RenderedHTML}}</div>
</article>

<script>
(() => {
  const LOCK_TIMEOUT_MS = 60000;
  const LOCKED_LABEL = "🔒****";

  async function unlockInline(el) {
    const ciphertext = el.dataset.ciphertext || "";
    if (!ciphertext) return;
    try {
      await window.gypsumSecure.requireKey();
      const plain = await window.gypsumSecure.decrypt(ciphertext);
      el.textContent = plain;
      el.classList.add("unlocked");
      setTimeout(() => {
        el.textContent = LOCKED_LABEL;
        el.classList.remove("unlocked");
      }, LOCK_TIMEOUT_MS);
    } catch (err) {
      console.error("secure reveal failed:", err);
    }
  }

  // Click on the redacted span reveals plaintext.
  document.querySelectorAll(".secure-inline").forEach((el) => {
    el.addEventListener("click", () => unlockInline(el));
  });

  // Copy buttons — decrypt and copy without revealing on screen.
  document.querySelectorAll(".secure-copy-btn").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const ciphertext = btn.dataset.ciphertext || "";
      if (!ciphertext) return;
      try {
        await window.gypsumSecure.requireKey();
        const text = await window.gypsumSecure.decrypt(ciphertext);
        await navigator.clipboard.writeText(text);
        btn.textContent = "✓";
        setTimeout(() => { btn.textContent = "📋"; }, 1500);
      } catch (error) {
        console.error("secure copy failed:", error);
      }
    });
  });

  // Interactive task-list checkboxes — clicking toggles the checkbox in the page source.
  document.querySelectorAll(".wiki-content input[type='checkbox']").forEach((cb, i) => {
    cb.removeAttribute("disabled");
    cb.addEventListener("change", async (e) => {
      cb.disabled = true;
      try {
        await fetch("/toggle-checkbox/{{.Page.Slug}}", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ index: String(i) }).toString(),
        });
      } finally {
        cb.disabled = false;
      }
    });
  });
})();
</script>
{{end}}
