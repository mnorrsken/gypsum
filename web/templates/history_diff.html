{{define "content"}}
<article>
  <div class="page-title-area">
    <h1>{{.Page.Title}}</h1>
    <hr class="title-rule" />
    <div class="page-tabs">
      <a href="/wiki/{{.Page.Slug}}">Page</a>
      <a href="/edit/{{.Page.Slug}}">Edit</a>
      <a href="/share/{{.Page.Slug}}">Share</a>
      <a href="/history/{{.Page.Slug}}">History</a>
    </div>
  </div>

  <p class="hint">Comparing revisions <code>{{.Query}}</code></p>

  {{.DiffHTML}}

  <div class="page-actions">
    <a href="/history/{{.Page.Slug}}" class="button secondary">Back to History</a>
    {{if .RestoreHash}}
    <form method="post" action="/restore/{{.Page.Slug}}"
          onsubmit="return confirm('Restore the older version? The current text is replaced, and the change is saved as a new revision you can undo.')">
      <input type="hidden" name="hash" value="{{.RestoreHash}}" />
      <button type="submit">Restore older version</button>
    </form>
    {{end}}
  </div>
</article>
{{end}}
