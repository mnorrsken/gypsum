{{define "content"}}
<article>
  <div class="page-title-area">
    <h1>Page Link Graph</h1>
    <hr class="title-rule" />
  </div>
  <div id="graph-container" style="width:100%;height:calc(100vh - 200px);border:1px solid var(--border-color, #ddd);border-radius:4px;display:flex;align-items:center;justify-content:center;">
    <p id="graph-loading">Loading graph library...</p>
  </div>
</article>

<script>
  window._graphData = {{.GraphJSON}};
</script>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"
        onerror="document.getElementById('graph-loading').textContent='Failed to load vis-network library from CDN.'"
></script>
<script>
(() => {
  if (typeof vis === 'undefined') return;

  const graphData = window._graphData || {};
  const loading = document.getElementById('graph-loading');
  if (loading) loading.remove();

  const nodes = [];
  const edges = [];
  const allSlugs = new Set();

  for (const [slug, links] of Object.entries(graphData)) {
    allSlugs.add(slug);
    for (const target of (links || [])) {
      allSlugs.add(target);
    }
  }

  if (allSlugs.size === 0) {
    document.getElementById('graph-container').innerHTML = '<p>No pages or links found.</p>';
    return;
  }

  for (const slug of allSlugs) {
    const exists = graphData.hasOwnProperty(slug);
    nodes.push({
      id: slug,
      label: slug.replace(/_/g, ' '),
      color: exists ? undefined : '#ff6666',
      title: exists ? slug : slug + ' (missing)',
      font: { size: 14 }
    });
  }

  for (const [slug, links] of Object.entries(graphData)) {
    for (const target of (links || [])) {
      edges.push({ from: slug, to: target, arrows: 'to' });
    }
  }

  const container = document.getElementById('graph-container');
  const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
  const options = {
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: { gravitationalConstant: -40, springLength: 120 },
      stabilization: { iterations: 200 }
    },
    interaction: { hover: true, navigationButtons: true },
    edges: { smooth: { type: 'continuous' }, color: { color: '#999', highlight: '#333' } },
    nodes: { shape: 'box', margin: 8, borderWidth: 1 }
  };
  const network = new vis.Network(container, data, options);
  network.on('doubleClick', (params) => {
    if (params.nodes.length > 0) {
      window.location.href = '/wiki/' + params.nodes[0];
    }
  });
})();
</script>
{{end}}
