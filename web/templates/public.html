{{define "public"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{.Title}} - Gypsum</title>
  <link rel="icon" href="{{asset "icon.svg"}}" type="image/svg+xml" />
  <link rel="stylesheet" href="{{asset "style.css"}}" />
  <script>
    (function() {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (_) {}
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>
  <script src="{{asset "mermaid-init.js"}}" defer></script>
  <script src="{{asset "lightbox.js"}}" defer></script>
</head>
<body class="public-page">
  <header class="public-header">
    <div class="public-header-inner">
      <div class="brand"><img class="brand-mark" src="{{asset "icon.svg"}}" alt="" width="28" height="28" /><span class="brand-name">Gypsum</span></div>
      <button class="icon-btn theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="icon-sun"><svg class="icon" aria-hidden="true"><use href="{{asset "icons.svg"}}#sun"/></svg></span>
        <span class="icon-moon"><svg class="icon" aria-hidden="true"><use href="{{asset "icons.svg"}}#moon"/></svg></span>
      </button>
    </div>
    <div class="topbar-rules">
      <div class="rule-red"></div>
    </div>
  </header>

  <main class="public-content">
    <article>
      <div class="page-title-area">
        <h1>{{.Title}}</h1>
        <hr class="title-rule" />
      </div>
      <div class="wiki-content">{{.RenderedHTML}}</div>
    </article>
  </main>

  <script>
  (function() {
    var themeBtn = document.getElementById("theme-toggle");
    themeBtn.addEventListener("click", function() {
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      var next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (_) {}
    });
  })();
  </script>
</body>
</html>
{{end}}
