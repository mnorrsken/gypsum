name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build-and-push:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release with binaries
    runs-on: ubuntu-latest
    needs: [test, build-and-push]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p dist
          build() { # binary package os arch
            ext=""
            [ "$3" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$3" GOARCH="$4" go build -trimpath -ldflags="-s -w" \
              -o "dist/$1_${VERSION}_$3_$4${ext}" "$2"
          }
          for os in linux darwin; do
            for arch in amd64 arm64; do
              build gypsum ./cmd/wiki "$os" "$arch"
              build mcp-proxy ./cmd/mcp-proxy "$os" "$arch"
            done
          done
          # mcp-proxy also runs next to Claude Desktop on Windows.
          build mcp-proxy ./cmd/mcp-proxy windows amd64
          build mcp-proxy ./cmd/mcp-proxy windows arm64
          (cd dist && sha256sum * > checksums.txt)

      - name: Release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION_NO_V="${VERSION#v}"
          awk -v v="$VERSION_NO_V" '
            $0 ~ "^## v" v "$" { found = 1; next }
            found && /^## /     { exit }
            found               { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "No CHANGELOG section for $VERSION" >&2; exit 1; }
          cat >> notes.md <<EOF

          ## Install

          Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION_NO_V}\`, Helm chart: \`oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/gypsum --version ${VERSION_NO_V}\`.

          Binaries below are named \`<binary>_${VERSION}_<os>_<arch>\`. After downloading, \`chmod +x\` them and check them with \`sha256sum -c checksums.txt --ignore-missing\`.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          gh release create "$VERSION" --title "Release $VERSION" --notes-file notes.md dist/*
