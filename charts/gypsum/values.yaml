# Default values for gypsum.

replicaCount: 1

image:
  repository: ghcr.io/mnorrsken/gypsum
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: wiki.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: wiki-tls
  #    hosts:
  #      - wiki.example.com

resources: {}
  # limits:
  #   cpu: 200m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

persistence:
  enabled: true
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

# Git configuration (passed as environment variables).
git:
  init: true
  commitName: "Gypsum"
  commitEmail: "gypsum@local"
  remoteName: ""
  remoteUrl: ""
  username: ""
  password: ""
  token: ""
  # How often to pull from the remote (Go duration, e.g. "5m", "30s").
  # Only used when remoteUrl is set.
  pullInterval: "5m"
  # Debounce window for pushes: edits within this window coalesce into a
  # single push after the burst settles. Set to "0" to push immediately on
  # every commit. Only used when remoteUrl is set.
  pushDelay: "30s"
  # Reference an existing Kubernetes Secret for git credentials.
  # The secret must contain keys named "password" and/or "token".
  existingSecret: ""

# OAuth configuration for the external MCP endpoint (/mcp/external).
oauth:
  # Set to true to enable the OAuth-protected /mcp/external endpoint.
  enabled: false
  # Password for the OAuth login page.
  # If left empty (and no existingSecret), a pre-install hook generates one automatically.
  password: ""
  # Public base URL with no trailing slash (e.g. https://wiki.example.com).
  # Required when oauth.enabled is true.
  externalUrl: ""
  # Access token lifetime (Go duration string, e.g. "24h", "12h").
  tokenTtl: "24h"
  # Reference an existing Kubernetes Secret for the OAuth password.
  # The secret must contain a key named "oauth-password".
  existingSecret: ""

# MCP endpoint settings.
mcp:
  # Tool sections to expose to AI assistants: read, edit, delete, skills, notes.
  # Empty enables all of them. Omit a section to hide those tools entirely — e.g.
  # [read] serves a wiki that assistants can search and read but never modify.
  # Accepts a list or a comma-separated string.
  sections: []

  # Extra browser origins allowed to call /mcp. The MCP transport spec requires
  # Origin validation to prevent DNS rebinding, so requests carrying a
  # disallowed Origin header are rejected with HTTP 403.
  #
  # oauth.externalUrl and loopback are always allowed, and requests without an
  # Origin header (Claude's remote connector, mcp-proxy, curl) are unaffected —
  # only browser-based MCP clients served from another origin need listing here.
  # Accepts a list or a comma-separated string; ["*"] disables the check.
  allowedOrigins: []

# Semantic search: pages and skills are embedded through an OpenAI-compatible
# /embeddings endpoint (Ollama, OpenAI, llama.cpp, vLLM, LiteLLM, ...) and
# search blends meaning-based matches with full-text matches. Off unless url
# is set or embed.server is enabled. Page text is sent to this endpoint, so
# prefer one you host.
embed:
  # Base URL; "/embeddings" is appended (e.g. http://ollama.ollama:11434/v1).
  url: ""
  # Embedding model name (e.g. nomic-embed-text). Required when url is set.
  model: ""
  # Existing Secret with a key named "api-key", for endpoints that need a key.
  existingSecret: ""

  # Deploy a CPU-only embeddings server (llama.cpp) as its own Deployment and
  # Service in the release namespace, and point gypsum at it; embed.url and
  # embed.model are then ignored. No GPU needed. The model is downloaded from
  # Hugging Face into an emptyDir each time the pod starts, so the pod needs
  # outbound HTTPS. Until it is ready, gypsum searches full-text only and
  # retries indexing in the background.
  server:
    enabled: false
    image:
      repository: ghcr.io/ggml-org/llama.cpp
      tag: server-v0.5.0
      pullPolicy: IfNotPresent
    # Hugging Face GGUF model as repo:quant. See the model table in the Helm
    # docs for small, medium and large multilingual choices. Changing it
    # re-embeds every page once.
    model: ggml-org/embeddinggemma-300M-GGUF:Q8_0
    port: 8080
    # CPU threads for inference. Keep it at or below the CPU limit.
    threads: 2
    # Upper bound for the downloaded model in the emptyDir.
    cacheSizeLimit: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        memory: 2Gi
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Per-deployment PBKDF2 salt for encrypted {{secure_aes2}} fields. The salt is
# not secret, but it must stay stable: changing it makes existing secure_aes2
# blocks undecryptable. If both value and existingSecret are empty, a pre-install
# hook generates a random salt and stores it in a Secret on first install.
secureSalt:
  # A base64-encoded salt to use directly (e.g. output of `head -c 16 /dev/urandom | base64`).
  value: ""
  # Reference an existing Kubernetes Secret containing a key named "secure-salt".
  existingSecret: ""

# Port for the dedicated health-probe server (liveness/readiness).
# This server runs without auth middleware so Kubernetes probes always succeed.
probePort: 9091

# Prometheus metrics for MCP tool usage.
metrics:
  # Set to true to expose the metrics port and create a Service port for scraping.
  enabled: false
  # Container port for the metrics server.
  port: 9090
  # Create a Prometheus ServiceMonitor resource for automatic scrape discovery.
  serviceMonitor:
    enabled: false
    # Scrape interval (e.g. "30s", "1m"). Omit to use the Prometheus default.
    interval: ""
    # Additional labels to add to the ServiceMonitor (e.g. release: kube-prometheus-stack).
    labels: {}

# Header-based authentication (for use behind a reverse proxy like Authelia).
auth:
  # Set the user header name to enable header auth (e.g. "Remote-User").
  # When set, every request (except OAuth endpoints) must include this header.
  userHeader: ""
  # Header containing comma-separated groups (default: Remote-Group).
  groupHeader: "Remote-Group"
  # If set, the group header must contain this group.
  requiredGroup: ""

nodeSelector: {}
tolerations: []
affinity: {}
