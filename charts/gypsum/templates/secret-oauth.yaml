{{/*
  Optional secret for the OAuth password.
  Only created when oauth.enabled is true, oauth.password is set,
  and no existingSecret is referenced.
*/}}
{{- if and .Values.oauth.enabled .Values.oauth.password (not .Values.oauth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gypsum.fullname" . }}-oauth
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
type: Opaque
data:
  oauth-password: {{ .Values.oauth.password | b64enc | quote }}
{{- end }}
