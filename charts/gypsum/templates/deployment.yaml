apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gypsum.fullname" . }}
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gypsum.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gypsum.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "gypsum.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate-data-layout
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          command:
            - sh
            - -c
            - |
              # Migrate from flat data/ layout to data/repo/ layout (v0.27.0+).
              # If data/pages/ exists but data/repo/ does not, move pages, images,
              # and .git into data/repo/. Leaves oauth_tokens.json in data/.
              DATA=/app/data
              if [ -d "$DATA/pages" ] && [ ! -d "$DATA/repo" ]; then
                echo "migrating data layout: data/ -> data/repo/"
                mkdir -p "$DATA/repo"
                for item in pages images .git .gitignore; do
                  [ -e "$DATA/$item" ] && mv "$DATA/$item" "$DATA/repo/$item"
                done
                echo "migration complete"
              else
                echo "no migration needed"
              fi
          volumeMounts:
            - name: data
              mountPath: /app/data
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: probes
              containerPort: {{ .Values.probePort | default 9091 }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port | default 9090 }}
              protocol: TCP
            {{- end }}
          env:
            - name: GYPSUM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "gypsum.secretName" . }}
                  key: secret-key
            {{- if .Values.git.init }}
            - name: GYPSUM_GIT_INIT
              value: "true"
            {{- end }}
            {{- if .Values.git.commitName }}
            - name: GYPSUM_GIT_COMMIT_NAME
              value: {{ .Values.git.commitName | quote }}
            {{- end }}
            {{- if .Values.git.commitEmail }}
            - name: GYPSUM_GIT_COMMIT_EMAIL
              value: {{ .Values.git.commitEmail | quote }}
            {{- end }}
            {{- if .Values.git.remoteName }}
            - name: GYPSUM_GIT_REMOTE_NAME
              value: {{ .Values.git.remoteName | quote }}
            {{- end }}
            {{- if .Values.git.remoteUrl }}
            - name: GYPSUM_GIT_REMOTE_URL
              value: {{ .Values.git.remoteUrl | quote }}
            {{- end }}
            {{- if .Values.git.username }}
            - name: GYPSUM_GIT_USERNAME
              value: {{ .Values.git.username | quote }}
            {{- end }}
            {{- if or .Values.git.password .Values.git.existingSecret }}
            - name: GYPSUM_GIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.existingSecret | default (printf "%s-git" (include "gypsum.fullname" .)) }}
                  key: password
                  optional: {{ not (empty .Values.git.existingSecret) }}
            {{- end }}
            {{- if or .Values.git.token .Values.git.existingSecret }}
            - name: GYPSUM_GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.existingSecret | default (printf "%s-git" (include "gypsum.fullname" .)) }}
                  key: token
                  optional: {{ not (empty .Values.git.existingSecret) }}
            {{- end }}
            {{- if .Values.git.pullInterval }}
            - name: GYPSUM_GIT_PULL_INTERVAL
              value: {{ .Values.git.pullInterval | quote }}
            {{- end }}
            {{- if .Values.git.pushDelay }}
            - name: GYPSUM_GIT_PUSH_DELAY
              value: {{ .Values.git.pushDelay | quote }}
            {{- end }}
            {{- if .Values.oauth.enabled }}
            - name: GYPSUM_OAUTH_ENABLED
              value: "true"
            - name: GYPSUM_OAUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.existingSecret | default (printf "%s-oauth" (include "gypsum.fullname" .)) }}
                  key: oauth-password
            - name: GYPSUM_EXTERNAL_URL
              value: {{ .Values.oauth.externalUrl | quote }}
            {{- if .Values.oauth.tokenTtl }}
            - name: GYPSUM_OAUTH_TOKEN_TTL
              value: {{ .Values.oauth.tokenTtl | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.auth.userHeader }}
            - name: GYPSUM_AUTH_USER_HEADER
              value: {{ .Values.auth.userHeader | quote }}
            {{- if .Values.auth.groupHeader }}
            - name: GYPSUM_AUTH_GROUP_HEADER
              value: {{ .Values.auth.groupHeader | quote }}
            {{- end }}
            {{- if .Values.auth.requiredGroup }}
            - name: GYPSUM_AUTH_REQUIRED_GROUP
              value: {{ .Values.auth.requiredGroup | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.probePort }}
            - name: GYPSUM_PROBE_PORT
              value: ":{{ .Values.probePort }}"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: GYPSUM_METRICS_PORT
              value: ":{{ .Values.metrics.port | default 9090 }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "gypsum.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
