{{/*
  Pre-install/pre-upgrade hook that generates a random OAuth password
  when oauth.enabled is true and oauth.password and oauth.existingSecret
  are both empty. Idempotent — skips if the secret already exists.
*/}}
{{- $needsOAuthPw := and .Values.oauth.enabled (not .Values.oauth.password) (not .Values.oauth.existingSecret) }}
{{- if $needsOAuthPw }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gypsum.fullname" . }}-generate-secret
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "gypsum.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "gypsum.fullname" . }}-secret-gen
      containers:
        - name: generate-secret
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              NAMESPACE="{{ .Release.Namespace }}"
              OAUTH_SECRET="{{ include "gypsum.fullname" . }}-oauth"
              if kubectl get secret "$OAUTH_SECRET" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Secret $OAUTH_SECRET already exists, skipping generation."
              else
                PW=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 32 | head -n 1)
                kubectl create secret generic "$OAUTH_SECRET" \
                  -n "$NAMESPACE" \
                  --from-literal=oauth-password="$PW"
                kubectl label secret "$OAUTH_SECRET" \
                  -n "$NAMESPACE" \
                  app.kubernetes.io/managed-by=Helm \
                  app.kubernetes.io/instance="{{ .Release.Name }}" \
                  helm.sh/chart="{{ include "gypsum.chart" . }}"
                echo "Secret $OAUTH_SECRET created with auto-generated password."
              fi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gypsum.fullname" . }}-secret-gen
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gypsum.fullname" . }}-secret-gen
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
    resourceNames:
      - "{{ include "gypsum.fullname" . }}-oauth"
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gypsum.fullname" . }}-secret-gen
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gypsum.fullname" . }}-secret-gen
subjects:
  - kind: ServiceAccount
    name: {{ include "gypsum.fullname" . }}-secret-gen
    namespace: {{ .Release.Namespace }}
{{- end }}
