{{/*
  When neither gypsum.secretKey nor gypsum.existingSecret is set,
  this pre-install/pre-upgrade hook generates a random 32-byte secret
  and stores it in a Kubernetes Secret. The hook is idempotent: it
  checks whether the secret already exists before creating it.
*/}}
{{- if and (not .Values.gypsum.secretKey) (not .Values.gypsum.existingSecret) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gypsum.fullname" . }}-generate-secret
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "gypsum.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "gypsum.fullname" . }}-secret-gen
      containers:
        - name: generate-secret
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              SECRET_NAME="{{ include "gypsum.fullname" . }}"
              NAMESPACE="{{ .Release.Namespace }}"

              # If the secret already exists, do nothing.
              if kubectl get secret "$SECRET_NAME" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Secret $SECRET_NAME already exists, skipping generation."
                exit 0
              fi

              # Generate a random 32-byte hex key.
              KEY=$(cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 64 | head -n 1)

              kubectl create secret generic "$SECRET_NAME" \
                -n "$NAMESPACE" \
                --from-literal=secret-key="$KEY"

              # Label the secret so it's visible as part of this release.
              kubectl label secret "$SECRET_NAME" \
                -n "$NAMESPACE" \
                app.kubernetes.io/managed-by=Helm \
                app.kubernetes.io/instance="{{ .Release.Name }}" \
                helm.sh/chart="{{ include "gypsum.chart" . }}"

              echo "Secret $SECRET_NAME created with auto-generated key."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gypsum.fullname" . }}-secret-gen
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gypsum.fullname" . }}-secret-gen
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
    resourceNames: ["{{ include "gypsum.fullname" . }}"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "gypsum.fullname" . }}-secret-gen
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "gypsum.fullname" . }}-secret-gen
subjects:
  - kind: ServiceAccount
    name: {{ include "gypsum.fullname" . }}-secret-gen
    namespace: {{ .Release.Namespace }}
{{- end }}
