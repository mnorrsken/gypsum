{{/*
  Optional secret for git credentials (password/token).
  Only created when git.password or git.token is set in values.
*/}}
{{- if or .Values.git.password .Values.git.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gypsum.fullname" . }}-git
  labels:
    {{- include "gypsum.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.git.password }}
  password: {{ .Values.git.password | b64enc | quote }}
  {{- end }}
  {{- if .Values.git.token }}
  token: {{ .Values.git.token | b64enc | quote }}
  {{- end }}
{{- end }}
